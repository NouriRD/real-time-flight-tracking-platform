resources:
  jobs:
    flight_tracking_pipeline:
      name: flight-tracking-pipeline-cicd

      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ../bronze/01_bronze_flight_streaming.py

        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ../silver/02_silver_flight_events.py

        - task_key: dim_aircraft
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../gold/05_gold_dim_aircraft.py

        - task_key: gold_positions
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../gold/03_gold_flight_positions.py

        - task_key: gold_metrics
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../gold/04_gold_flight_metrics.py